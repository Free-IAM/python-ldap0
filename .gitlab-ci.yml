.tests:
  script: pushd /var/tmp && popd && pip install -e . && python setup.py test
  stage: test
  only:
    refs:
      - branches

.LTB-RPM-REPO: &script-1 |
  echo '
  [ltb-project]
  name=LTB project packages
  baseurl=https://ltb-project.org/rpm/$releasever/$basearch
  enabled=1
  gpgcheck=1
  gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-LTB-project
  ' > /etc/yum.repos.d/ltb-project.repo


test:tumbleweed:
  extends: .tests
  image: opensuse/tumbleweed
  before_script:
  - zypper update 
  - zypper install -l -y cyrus-sasl-digestmd5 cyrus-sasl-scram cyrus-sasl-crammd5 cyrus-sasl-plain openldap2 python2-setuptools python2-setuptools-git python2-setuptools_scm gcc python-devel openldap2-devel cyrus-sasl-devel python2-pip python2-Jinja2 python2-tox git openldap2-back-sock openldap2-contrib openldap2-client openldap2-ppolicy-check-password
  - 'echo "mech_list: PLAIN GSSAPI DIGEST-MD5 CRAM-MD5 SCRAM-SHA-1 EXTERNAL" > /etc/sasl2/slapd.conf'

test:leap:
  extends: .tests
  image: opensuse/leap
  before_script:
  - zypper update 
  - zypper install -l -y openldap2 python2-setuptools python2-setuptools-git python2-setuptools_scm gcc python-devel openldap2-devel cyrus-sasl-devel python2-pip python2-Jinja2 python2-tox git openldap2-back-sock openldap2-contrib openldap2-client openldap2-ppolicy-check-password

test:centos:
  extends: .tests
  image: centos:latest
  before_script:
  - yum update
  - rpm --import https://ltb-project.org/lib/RPM-GPG-KEY-LTB-project
  - yum install epel-release -y
  - *script-1
  - yum install -y openldap-ltb openldap-ltb-contrib-overlays openldap-ltb-mdb-utils openldap-ltb-ppm openldap-ltb-check-password cracklib openldap-devel python-setuptools gcc python-devel cyrus-sasl-devel python-pip python-jinja2 python-tox git
  - export SLAPD=/usr/local/openldap/libexec/slapd 
  - export SCHEMA=/usr/local/openldap/etc/openldap/schema 
  - export BIN=/usr/local/openldap/bin/ 
  - export SBIN=/usr/local/openldap/sbin/
  
test:debian:
  extends: .tests
  image: debian:latest
  before_script:
  - apt-get update
  - apt-get install -y wget apt-transport-https gnupg2
  - echo "deb [arch=amd64] https://ltb-project.org/debian/stretch stretch main" > /etc/apt/sources.list.d/ltb-project.list
  - wget -O - https://ltb-project.org/lib/RPM-GPG-KEY-LTB-project | apt-key add -
  - apt-get update
  - apt-get install -y openldap-ltb openldap-ltb-contrib-overlays openldap-ltb-mdb-utils openldap-ltb-ppm openldap-ltb-check-password cracklib-runtime libldap2-dev libsasl2-dev python-setuptools python-setuptools-git python-setuptools-scm gcc python-dev python-pip python-jinja2 python-tox git
  - export SLAPD=/usr/local/openldap/libexec/slapd 
  - export SCHEMA=/usr/local/openldap/etc/openldap/schema 
  - export BIN=/usr/local/openldap/bin/ 
  - export SBIN=/usr/local/openldap/sbin/
